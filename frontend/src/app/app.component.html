<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Личный ассистент</title>
</head>
<body>

<div class="container-fluid" style="background-color: #D4CBC8">
  <div class="row">

    <div class="col-md-2 navbar-container" >
       <nav class="navbar navbar-expand-lg navbar-light">
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>


        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <!-- Пункты вертикального меню -->
          <ul class="navbar-nav">
            <li class="nav-item">
            
              <a class="navbar-link"  routerLink="/account">
              <img src="././assets/image/profile.png" alt="профиль">
              Профиль
            </a>
            
            </li>
            
            <hr>
            <li class="nav-item">
              <app-calendar [currentDate]="currentDate"></app-calendar>
            </li>
            
            <hr>
            <li class="nav-item">
              <a class="nav-link" routerLink="/">
                <img src="././assets/image/home.png" alt="главный экран">
                Главный экран
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" routerLink="/timetable">
                <img src="././assets/image/school.png" alt="Расписание">
                Расписание
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" routerLink="/plans">
                <img src="././assets/image/plans.png" alt="планы">
                Планы
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" routerLink="/diary">
                <img src="././assets/image/diary.png" alt="Дневник">
                Дневник
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" routerLink="/balance-wheel">
                <img src="././assets/image/balance.png" alt="колесо баланса">
                Колесо баланса
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" routerLink="/storage">
                <img src="././assets/image/archiv.png" alt="хранилище">
                Хранилище
              </a>
            </li>
            
          </ul>
        </div>
      </nav>
    </div>

    <div class="col-md-10 col-lg-10 content-container">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
</body>
</html>
