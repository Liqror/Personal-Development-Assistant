<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Личный ассистент</title>
</head>

<body>
    
    <!-- Основной контент страницы  -->
     <div  class="col-md-12 col-lg-12 mt-md-2">
        <h2>Просмотр колеса баланса
            от <input [(ngModel)]="start" (ngModelChange)="getWheel()" class="wheel_date_input" type="date" id="wheel_date_from"> 
            до <input [(ngModel)]="stop" (ngModelChange)="getWheel()" class="wheel_date_input" type="date" id="wheel_date_to">
        </h2>
    </div>
    <div class="col-md-12 col-lg-12 content-container">  
        <div class="row justify-content-center">
            <div class="col-md-4 col-lg-4 mt-md-1">
                <h2>Категории</h2>
                <hr>
                <!-- Кнопка "Создание новой категории" -->
                <p>
                    <button onclick="showDivNewCtg()" class="showDivNewCtg"> <img src="././assets/image/add.png" alt="новая категория" class="styleImg">Добавить категорию</button>
                </p>

                <div *ngFor="let category of categories; let i = index" class="styleForCtg">
                    <div class="divTextCtg">
                      <label class="labelTextCtg">
                        <input
                            class="real_checkbox"
                            type="checkbox"
                            name="ctg"
                            [(ngModel)]="category.active"
                            (change)="updateCategoryTick(category)"
                        />
                        <span class="custom_checkbox"></span>
                        <p class="textCtg">
                          <button
                            class="seeCtgInfo"
                            (click)="editCategory(i)"
                          >
                            <ng-container *ngIf="isEditing === i; else showText">
                                <input
                                #inputField
                                [(ngModel)]="category.title"
                                (blur)="updateCategoryTitle(i)"
                                (keydown.enter)="updateCategoryTitle(i)"
                                class="edit-input"
                              />                                                  
                            </ng-container>
                            <ng-template #showText>
                              {{ category.title }}
                            </ng-template>
                          </button>
                        </p>
                      </label>
                    </div>

                    <div class="colorCircle" style="position: relative; display: inline-block;">
                        <svg width="20" height="20" (click)="openColorPicker(i)">
                          <circle cx="10" cy="10" r="10" [attr.fill]="category.color" />
                        </svg>
                      
                        <input
                          id="colorPicker-{{i}}"
                          type="color"
                          [(ngModel)]="category.color"
                          (input)="onColorInput(i)"
                          style="position: absolute; top: 0; left: 0; opacity: 0; width: 0; height: 0;"
                          #colorPicker
                        />
                      </div>
                                        
                </div>
                  
            </div>

            <div class="col-md-7 col-lg-7 mt-md-1">
                <canvas #balanceWheelCanvas width="600px" height="600px"></canvas>
            </div>
        </div>
    </div>

    <div id="newCtg" class="newCtg">
        <div class="container">
            <p><input [(ngModel)]="newCategory.title" id="nameCtg" type="text" name="userName" placeholder="Введите название категории" class="newNameCtg" /></p>
            <p>Выберите цвет для категории: </p>
            <input type="color" id="head" name="head" value="#F8A831" class="newColorCtg" [(ngModel)]="newCategory.color" />
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-6">
                  <p class="textUpdWheel"><button onclick="checkInputForBalanceWheel()" id="save-button-new-ctg" class="save" (click)="createOrUpdateCategory()" (click)="changeFlag()" onclick="hideDivCtg()" (click)="clearForm()">Сохранить</button><p>
                </div>
                <div class="col-md-6 col-lg-6">
                  <p class="textBtnStyle"><button onclick="hideDivCtg()" id="close-button" class="close" (click)="changeFlag()" (click)="clearForm()">Закрыть</button><p>
                </div>
            </div>

            <div class="error-massage">
                <p id="checkCtgName" class="errorText"></p> <!-- ЕСЛИ НАЗВАНИЕ ПУСТО, ТО ВЫЛАЗИТ ОШИБКА ПРИ СОХРАНЕНИИ -->
            </div>

        </div>
    </div>
</body>
